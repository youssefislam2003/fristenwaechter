# pytest.ini
[pytest]
asyncio_mode = auto
# each async test gets its own event loop (pytest-asyncio default); engines
# are function-scoped in conftest.py precisely because asyncpg pools bind
# to the loop that created them.
testpaths = tests
filterwarnings =
    error::sqlalchemy.exc.SAWarning

# Test-environment requirements (requirements-test.txt):
#   pytest>=8.2
#   pytest-asyncio>=0.23
#   testcontainers[postgres]>=4.7
#   sqlalchemy[asyncio]>=2.0.30
#   asyncpg>=0.29
#   alembic>=1.13
#   apscheduler>=3.10
