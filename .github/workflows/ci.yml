name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Fast, no-Docker gates: lint, strict types, pure unit tests.
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check app/
      - name: Typecheck (mypy --strict)
        run: mypy --strict app/
      - name: Unit tests (no Docker)
        run: pytest tests/ --ignore=tests/integration -v

  # Real-Postgres integration suite (testcontainers needs a Docker daemon,
  # which GitHub-hosted runners provide).
  integration:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Integration tests (testcontainers Postgres 16)
        run: pytest tests/integration -v

  # DBA review artifact: the full migration DDL as SQL, no live connection.
  migration-sql:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render alembic upgrade --sql
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://u:p@localhost/db
        run: alembic upgrade head --sql > migration-review.sql
      - name: Upload migration SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-review-sql
          path: migration-review.sql
